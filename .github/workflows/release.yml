name: Build and release Go shared libraries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'version name'
        required: true
        default: 'v1.0.0'


jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            output_name: libzerogtfs.so
          - os: macos-latest
            output_name: libzerogtfs.dylib
          - os: windows-latest
            output_name: libzerogtfs.dll

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.13'
          cache: true

      # compile
      - name: Build Shared Library
        shell: bash
        run: |
          go build -buildmode=c-shared -o ${{ matrix.output_name }} $(ls *.go | grep -v main.go)


      # save our files
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: |
            ${{ matrix.output_name }}
            libzerogtfs.h

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # download our prev artifacts
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Organize files
        run: |
          mkdir -p final-assets
          find artifacts -type f -exec cp {} final-assets/ \;
          ls -l final-assets/

      # publish
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version_tag || github.ref_name }}
          files: |
            final-assets/libzerogtfs.so
            final-assets/libzerogtfs.dylib
            final-assets/libzerogtfs.dll
            final-assets/libzerogtfs.h
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
